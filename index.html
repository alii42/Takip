<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#236b4b"><meta name="description" content="Çevrimdışı ders, kitap, araştırma ve kişisel gelişim takip uygulaması">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>İlim Takip</title>
<style>
:root{--green:#236b4b;--green2:#e5f2e9;--bg:#f5f7f5;--panel:#fff;--text:#1c2922;--muted:#66756c;--line:#dfe7e1;--accent:#236b4b;--shadow:0 4px 18px #153b2410}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}body.dark{--bg:#121916;--panel:#1b2520;--text:#e8f0ea;--muted:#a7b7ac;--line:#34443a;--green2:#243b2d;--shadow:0 4px 18px #0003}body[data-accent="blue"]{--green:#285c93;--green2:#e6eef8;--accent:#285c93}body[data-accent="burgundy"]{--green:#853d51;--green2:#f7e8ed;--accent:#853d51}body[data-accent="sand"]{--green:#80643b;--green2:#f3ecdf;--accent:#80643b}header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px clamp(14px,3vw,30px);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:4} .brand{display:flex;gap:10px;align-items:center}.logo{width:38px;height:38px;border-radius:12px;background:var(--green);color:white;display:grid;place-items:center;font-weight:800;font-size:19px}.brand h1{font-size:19px;margin:0}.brand small{color:var(--muted)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 12px;border-radius:10px}button.primary{background:var(--green);border-color:var(--green);color:#fff}button.ghost{border-color:transparent;background:transparent}button.danger{color:#b33a3a}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1500px;margin:auto;min-height:calc(100vh - 68px)}aside{padding:18px 12px;border-right:1px solid var(--line);background:var(--panel)}nav{display:grid;gap:5px;position:sticky;top:85px}nav button{text-align:left;border-color:transparent;background:transparent;display:flex;gap:10px;align-items:center}nav button.active{background:var(--green2);color:var(--green);font-weight:650}main{padding:clamp(14px,3vw,30px);min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.pagehead h2{margin:0 0 4px;font-size:25px}.muted,small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}.span12{grid-column:span 12}.span8{grid-column:span 8}.span7{grid-column:span 7}.span6{grid-column:span 6}.span5{grid-column:span 5}.span4{grid-column:span 4}.span3{grid-column:span 3}.card h3{margin:0 0 12px;font-size:16px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:8px}.stat{font-size:25px;font-weight:750;margin:3px 0}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:13px;color:var(--muted);font-weight:600}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:10px 11px;min-width:0}textarea{min-height:95px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.full{grid-column:1/-1}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item-title{font-weight:650}.pill{font-size:12px;background:var(--green2);color:var(--green);padding:4px 8px;border-radius:999px;white-space:nowrap}.empty{color:var(--muted);padding:16px 0}.daytabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.daytab{padding:10px 4px;text-align:center}.daytab b{display:block}.daytab small{font-size:11px}.daytab.selected{background:var(--green2);border-color:var(--green);color:var(--green)}.weekrow{display:grid;grid-template-columns:65px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.weekrow:last-child{border:0}.lesson{background:var(--green2);border-left:3px solid var(--green);padding:8px 10px;border-radius:7px;margin:4px 0}.lesson strong{display:block}.checkrow{display:flex;align-items:flex-start;gap:9px;padding:8px 0}.checkrow input{width:18px;height:18px;margin-top:2px;accent-color:var(--green)}.checkrow span{flex:1}.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:var(--green);border-radius:99px}.navmobile{display:none}.hidden{display:none!important}.searchbar{max-width:450px}.notice{background:var(--green2);padding:12px;border-radius:10px;color:var(--text);font-size:13px}.timer{font-size:38px;font-weight:750;letter-spacing:1px}.tag{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-size:12px;color:var(--muted)}.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.calcell{min-height:52px;padding:5px 2px;text-align:center;border-radius:8px;border:1px solid var(--line);font-size:12px}.calcell.has{background:var(--green2);border-color:var(--green)}.calcell.picked{outline:2px solid var(--green)}.barline{display:flex;align-items:center;gap:9px;margin:10px 0}.barline .barlabel{width:100px;font-size:13px}.barline .progress{flex:1;margin:0}.barline .num{width:45px;text-align:right;font-size:12px;color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17241b;color:white;padding:11px 16px;border-radius:12px;z-index:20;box-shadow:var(--shadow)}footer{color:var(--muted);font-size:12px;margin-top:24px;text-align:center}
@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:none}main{padding:15px 12px 90px}.navmobile{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--panel);border-top:1px solid var(--line);padding:6px max(4px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));justify-content:space-around;gap:2px}.navmobile button{border:0;padding:7px 3px;display:grid;justify-items:center;gap:2px;font-size:10px;flex:1}.navmobile button.active{color:var(--green);background:var(--green2)}.navmobile button span{font-size:18px}.span8,.span7,.span6,.span5,.span4,.span3{grid-column:span 12}.pagehead h2{font-size:22px}.brand small{display:none}.daytabs{gap:3px}.daytab{font-size:12px;padding:8px 1px}.daytab small{font-size:10px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.timer{font-size:32px}}
</style></head><body>
<header><div class="brand"><div class="logo">İ</div><div><h1>İlim Takip</h1><small>Ders • Araştırma • Gelişim</small></div></div><div class="row"><button class="ghost" id="quickAdd" title="Hızlı kayıt">＋ <span class="wide">Hızlı kayıt</span></button><button class="ghost" id="headerSearch" title="Ara">⌕</button></div></header>
<div class="layout"><aside><nav id="sideNav"></nav><div class="notice" style="margin-top:22px">Kayıtların bu cihazda saklanır. Verilerini korumak için düzenli yedek al.</div></aside><main id="app"></main></div><nav class="navmobile" id="mobileNav"></nav><div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), today=()=>new Date().toISOString().slice(0,10), uid=()=>Math.random().toString(36).slice(2,10), fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'}):'—', minsText=n=>{n=Number(n)||0;return `${Math.floor(n/60)} sa ${n%60} dk`}, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), dayNames=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'], shortDays=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const blank=()=>({version:1,settings:{theme:'light',accent:'green'},schedule:[],tasks:[],dailyChecks:{},logs:[],books:[],research:[],topics:[],goals:[],habits:[],habitHistory:{},repeats:[],notes:[],attachments:[]});let data;try{data=JSON.parse(localStorage.getItem('ilimTakipData')||'null')}catch{}if(!data||typeof data!=='object')data=blank();for(const [k,v] of Object.entries(blank()))if(data[k]===undefined)data[k]=v;let page='home',selectedDay=(new Date().getDay()+6)%7,selectedDate=today(),timerStart=null,timerElapsed=0,timerInterval=null,timerSubject='',searchQuery='',reportMonth=today().slice(0,7),editing=null;
function save(){try{localStorage.setItem('ilimTakipData',JSON.stringify(data));applyTheme()}catch(e){toast('Depolama dolu olabilir. Yedek alıp büyük ekleri kontrol et.')}}function applyTheme(){document.body.classList.toggle('dark',data.settings.theme==='dark'||(data.settings.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches));document.body.dataset.accent=data.settings.accent||'green'}function toast(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2400)}
const nav=[['home','⌂','Ana sayfa'],['program','▦','Program'],['tasks','☑','Görevler'],['books','▤','Kitaplık'],['research','⌕','Araştırmalar'],['growth','↗','Kişisel gelişim'],['repeats','⟳','Tekrar planı'],['reports','▥','Raporlar'],['settings','⚙','Ayarlar']];function navRender(){for(const id of ['sideNav','mobileNav']){$('#'+id).innerHTML=nav.map(([k,ic,t],i)=>`<button class="${page===k?'active':''}" data-page="${k}"><span>${ic}</span>${id==='mobileNav'?`<small>${t}</small>`:t}</button>`).join('')}}
function go(p){page=p;editing=null;render()}function header(title,sub='',action=''){return `<div class="pagehead"><div><h2>${title}</h2>${sub?`<div class="muted">${sub}</div>`:''}</div>${action}</div>`}function card(title,body,cls='span6',right=''){return `<section class="card ${cls}"><div class="between"><h3>${title}</h3>${right}</div>${body}</section>`}function empty(s){return `<div class="empty">${s}</div>`}function btn(label,action,primary=false){return `<button ${primary?'class="primary"':''} data-action="${action}">${label}</button>`}function field(label,name,type='text',value='',placeholder='',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${extra}></div>`}function textarea(label,name,value='',placeholder=''){return `<div class="field"><label>${label}</label><textarea name="${name}" placeholder="${esc(placeholder)}">${esc(value)}</textarea></div>`}function selectField(label,name,opts,value=''){return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===value?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`}function subjects(){return [...new Set(data.schedule.map(x=>x.subject).concat(data.logs.map(x=>x.subject)).filter(Boolean))].sort()}function logsIn(start,end){return data.logs.filter(x=>x.date>=start&&x.date<=end)}function totalMins(logs){return logs.reduce((a,x)=>a+(+x.minutes||0),0)}function weekStart(d){let x=new Date(d+'T12:00:00');let day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toISOString().slice(0,10)}function addDays(d,n){let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}function dayIndex(d){return (new Date(d+'T12:00:00').getDay()+6)%7}function getDaySchedule(i){return data.schedule.filter(x=>+x.day===i).sort((a,b)=>(a.start||'').localeCompare(b.start||''))}
function home(){let w=weekStart(today()),we=addDays(w,6),weeklogs=logsIn(w,we),todaylogs=logsIn(today(),today()),todayTasks=data.tasks.filter(t=>!t.date||t.date===today()),openTasks=todayTasks.filter(t=>!t.done),checks=data.dailyChecks[today()]||{},due=data.repeats.filter(r=>r.date<=today()&&!r.done),hToday=data.habits.filter(h=>h.active!==false),doneHab=hToday.filter(h=>(data.habitHistory[today()]||{})[h.id]).length;let schedule=`<div class="daytabs">${shortDays.map((d,i)=>`<button class="daytab ${selectedDay===i?'selected':''}" data-action="pickDay" data-value="${i}"><b>${d}</b><small>${getDaySchedule(i).length} ders</small></button>`).join('')}</div><div style="margin-top:12px">${getDaySchedule(selectedDay).map(x=>`<div class="lesson"><div class="between"><strong>${esc(x.subject)}</strong><span class="tag">${esc(x.start||'—')}${x.end?'–'+esc(x.end):''}</span></div>${x.topic?`<small>${esc(x.topic)}</small>`:''}${x.homework?`<div style="font-size:13px;margin-top:4px">Ödev: ${esc(x.homework)}</div>`:''}${x.note?`<div class="muted" style="font-size:12px">${esc(x.note)}</div>`:''}<div class="row" style="margin-top:5px"><button data-action="editSchedule" data-id="${x.id}">Düzenle</button></div></div>`).join('')||empty('Bu gün için ders eklenmemiş.')}<div class="row" style="margin-top:10px">${btn('＋ Ders ekle','addSchedule')}</div></div>`;
let taskhtml=openTasks.slice(0,5).map(t=>`<label class="checkrow"><input type="checkbox" data-action="taskCheck" data-id="${t.id}" ${t.done?'checked':''}><span>${esc(t.title)} ${t.date?`<small>· ${fmtDate(t.date)}</small>`:''}</span></label>`).join('')||empty('Bugün için bekleyen görev yok.');let habitshtml=hToday.slice(0,6).map(h=>`<label class="checkrow"><input type="checkbox" data-action="habitCheck" data-id="${h.id}" ${(data.habitHistory[today()]||{})[h.id]?'checked':''}><span>${esc(h.name)}</span></label>`).join('')||empty('Henüz alışkanlık eklenmemiş.');let duehtml=due.slice(0,4).map(r=>`<div class="item"><div class="between"><span class="item-title">${esc(r.title)}</span><span class="pill">${fmtDate(r.date)}</span></div><small>${esc(r.subject||'Tekrar')}</small></div>`).join('')||empty('Bugün bekleyen tekrar yok.');let recent=data.research.slice().sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')).slice(0,3).map(r=>`<div class="item"><div class="between"><span class="item-title">${esc(r.title)}</span>${r.star?'★':''}</div><small>${fmtDate(r.updated)}</small><div class="row" style="margin-top:6px"><button data-action="openResearch" data-id="${r.id}">Aç</button></div></div>`).join('')||empty('Henüz araştırma kaydı yok.');return header('Ana sayfa',fmtDate(today())+' · Haftalık çalışma ve günlük takip',btn('＋ Çalışma kaydı','addLog',true))+`<div class="grid">${card('Haftalık ders programı',schedule,'span8',`<button data-action="goProgram">Tüm program</button>`)}${card('Bugünün özeti',`<div class="muted">Çalışma süresi</div><div class="stat">${minsText(totalMins(todaylogs))}</div><div class="muted">Haftalık toplam</div><div class="stat">${minsText(totalMins(weeklogs))}</div><div class="row">${btn('Zamanlayıcı','timer')}${btn('Geçmiş çalışma ekle','addLog')}</div>`,'span4')}${card('Bugünkü görevler',taskhtml,'span6',btn('Tüm görevler','goTasks'))}${card('Alışkanlıklar',`${habitshtml}<div class="progress"><i style="width:${hToday.length?doneHab/hToday.length*100:0}%"></i></div><small>${doneHab}/${hToday.length} tamamlandı</small><div class="row" style="margin-top:8px">${btn('Alışkanlık ekle','addHabit')}</div>`,'span6')}${card('Tekrar zamanı gelenler',duehtml,'span6',btn('Tekrar planı','goRepeats'))}${card('Son araştırmalar',recent,'span6',btn('Araştırma arşivi','goResearch'))}</div>`}
function program(){let i=selectedDay;return header('Haftalık program','Derslerini ve derslere ait ödev/notları gün gün düzenle.',btn('＋ Ders ekle','addSchedule',true))+`<div class="card"><div class="daytabs">${dayNames.map((d,n)=>`<button class="daytab ${i===n?'selected':''}" data-action="pickDay" data-value="${n}"><b>${shortDays[n]}</b><small>${getDaySchedule(n).length} ders</small></button>`).join('')}</div><div style="margin-top:16px">${getDaySchedule(i).map(x=>`<div class="weekrow"><div><b>${esc(x.start||'—')}</b><small style="display:block">${esc(x.end||'')}</small></div><div><div class="between"><strong>${esc(x.subject)}</strong><div class="row"><button data-action="editSchedule" data-id="${x.id}">Düzenle</button><button class="danger" data-action="deleteSchedule" data-id="${x.id}">Sil</button></div></div>${x.topic?`<div>${esc(x.topic)}</div>`:''}${x.homework?`<div class="notice" style="margin-top:7px">Ödev: ${esc(x.homework)}</div>`:''}${x.note?`<small>${esc(x.note)}</small>`:''}</div></div>`).join('')||empty('Bu gün için program boş.')}<div class="row" style="margin-top:12px">${btn('＋ Bu güne ders ekle','addSchedule',true)}</div></div></div>`}
function tasksPage(){let tasks=data.tasks.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));let habits=data.habits;return header('Görevler ve alışkanlıklar','Günlük görevler, özel görevler ve alışkanlık takibi.',btn('＋ Görev ekle','addTask',true))+`<div class="grid">${card('Görev listesi',`${tasks.map(t=>`<div class="item"><label class="checkrow"><input type="checkbox" data-action="taskCheck" data-id="${t.id}" ${t.done?'checked':''}><span><span class="item-title">${esc(t.title)}</span><small style="display:block">${t.date?fmtDate(t.date)+' · ':''}${esc(t.category||'Genel')}</small>${t.note?`<small>${esc(t.note)}</small>`:''}</span><button data-action="editTask" data-id="${t.id}">Düzenle</button><button class="danger" data-action="deleteTask" data-id="${t.id}">×</button></label></div>`).join('')||empty('Henüz görev yok.')}<div class="row">${btn('＋ Yeni görev','addTask')}</div>`,'span7')}${card('Alışkanlıklar',`${habits.map(h=>`<div class="item"><div class="between"><div><b>${esc(h.name)}</b><small style="display:block">${esc(h.frequency||'Her gün')}</small></div><div class="row"><button data-action="editHabit" data-id="${h.id}">Düzenle</button><button class="danger" data-action="deleteHabit" data-id="${h.id}">×</button></div></div></div>`).join('')||empty('Henüz alışkanlık tanımlanmadı.')}<div class="row">${btn('＋ Alışkanlık ekle','addHabit',true)}</div>`,'span5')}${card('Günlük takip',`<div class="muted">${fmtDate(selectedDate)}</div>${(data.dailyChecks[selectedDate]||{}).custom?.map((x,i)=>`<label class="checkrow"><input type="checkbox" data-action="dailyCheck" data-id="${i}" ${(data.dailyChecks[selectedDate].customDone||[]).includes(i)?'checked':''}><span>${esc(x)}</span></label>`).join('')||empty('Bu güne özel kontrol listesi ekleyebilirsin.')}<div class="row">${btn('＋ Günlük kontrol maddesi','addDailyCheck')}</div><div class="field"><label>Gün seç</label><input type="date" id="dailyDate" value="${selectedDate}"></div>`,'span12')}</div>`}
function booksPage(){return header('Kitaplığım','Kitapları, sayfa ilerlemesini ve okuma notlarını tek yerde tut.',btn('＋ Kitap ekle','addBook',true))+`<div class="grid">${data.books.map(b=>`<section class="card span6"><div class="between"><div><h3>${esc(b.title)}</h3><small>${esc(b.author||'Yazar belirtilmedi')}</small></div><div class="row"><button data-action="editBook" data-id="${b.id}">Düzenle</button><button class="danger" data-action="deleteBook" data-id="${b.id}">×</button></div></div><div class="progress"><i style="width:${b.total?Math.min(100,(b.current||0)/b.total*100):0}%"></i></div><div class="between"><small>${b.current||0} / ${b.total||'?'} sayfa</small><b>${b.total?Math.round((b.current||0)/b.total*100)+'%':'—'}</b></div>${b.note?`<p>${esc(b.note)}</p>`:''}${b.start?`<small>Başlangıç: ${fmtDate(b.start)}</small>`:''}</section>`).join('')||`<div class="card span12">${empty('Kitaplığın boş. Kitap ekleyerek okuma ilerlemeni takip edebilirsin.')}</div>`}</div>`}
function researchPage(){let list=data.research.filter(r=>!searchQuery||[r.title,r.content,r.source,r.tags].join(' ').toLowerCase().includes(searchQuery.toLowerCase())).sort((a,b)=>(b.star-a.star)||(b.updated||'').localeCompare(a.updated||''));return header('Araştırma arşivi','Konu başlıkları, uzun notlar ve kaynaklar.',btn('＋ Araştırma ekle','addResearch',true))+`<div class="row" style="margin-bottom:14px"><input class="searchbar" id="globalSearch" placeholder="Araştırmalarda ara…" value="${esc(searchQuery)}"><button data-action="search">Ara</button><button data-action="clearSearch">Temizle</button></div><div class="grid">${list.map(r=>`<section class="card span6"><div class="between"><h3>${esc(r.title)}</h3><button data-action="starResearch" data-id="${r.id}">${r.star?'★':'☆'}</button></div><small>${fmtDate(r.updated)} ${r.tags?` · ${esc(r.tags)}`:''}</small><p>${esc((r.content||'').slice(0,220))}${(r.content||'').length>220?'…':''}</p>${r.source?`<small>Kaynak: ${esc(r.source)}</small>`:''}<div class="row" style="margin-top:10px"><button data-action="editResearch" data-id="${r.id}">Aç / düzenle</button><button class="danger" data-action="deleteResearch" data-id="${r.id}">Sil</button></div></section>`).join('')||`<div class="card span12">${empty(searchQuery?'Aramayla eşleşen kayıt bulunamadı.':'Henüz araştırma kaydı yok.')}</div>`}</div>`}

function reportsPage(){let start=reportMonth+'-01',end=reportMonth+'-'+new Date(+reportMonth.slice(0,4),+reportMonth.slice(5,7),0).getDate(),logs=logsIn(start,end),total=totalMins(logs),by={};logs.forEach(l=>by[l.subject||'Diğer']=(by[l.subject||'Diğer']||0)+(+l.minutes||0));let max=Math.max(1,...Object.values(by));let monthDays= new Date(+reportMonth.slice(0,4),+reportMonth.slice(5,7),0).getDate(),first=dayIndex(start);let cells=Array.from({length:first},()=>'<div></div>').concat(Array.from({length:monthDays},(_,i)=>{let d=reportMonth+'-'+String(i+1).padStart(2,'0'),daylogs=logsIn(d,d);return `<button class="calcell ${daylogs.length?'has':''} ${selectedDate===d?'picked':''}" data-action="pickDate" data-value="${d}">${i+1}${daylogs.length?`<small style="display:block">${daylogs.length} kayıt</small>`:''}</button>`})).join('');return header('Raporlar','Geçmiş günlere ve dönemlere dönerek çalışma kayıtlarını incele.')+`<div class="grid">${card('Aylık çalışma raporu',`<div class="row"><input type="month" id="reportMonth" value="${reportMonth}" style="max-width:210px"><button data-action="refreshReport">Göster</button></div><div class="stat">${minsText(total)}</div><small>${logs.length} çalışma kaydı · ${start} – ${end}</small><h3 style="margin-top:20px">Derslere göre süre</h3>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([s,n])=>`<div class="barline"><span class="barlabel">${esc(s)}</span><div class="progress"><i style="width:${n/max*100}%"></i></div><span class="num">${Math.round(n/60*10)/10} sa</span></div>`).join('')||empty('Bu ay çalışma kaydı yok.')}`,'span7')}${card('Çalışma takvimi',`<div class="calgrid">${shortDays.map(x=>`<small style="text-align:center">${x}</small>`).join('')}${cells}</div><div class="notice" style="margin-top:12px">Seçili gün: <b>${fmtDate(selectedDate)}</b><div style="margin-top:4px">${logsIn(selectedDate,selectedDate).map(l=>`${esc(l.subject)} · ${minsText(l.minutes)}`).join('<br>')||'Bu gün için kayıt yok.'}</div><div class="row" style="margin-top:8px">${btn('Bu güne kayıt ekle','addLog')}</div></div>`,'span5')}${card('Seçili günün kayıtları',`${logsIn(selectedDate,selectedDate).map(l=>`<div class="item"><div class="between"><b>${esc(l.subject)}</b><b>${minsText(l.minutes)}</b></div><small>${fmtDate(l.date)} ${l.pages?`· Sayfa: ${esc(l.pages)}`:''}</small>${l.topic?`<div>${esc(l.topic)}</div>`:''}${l.note?`<small>${esc(l.note)}</small>`:''}<div class="row" style="margin-top:6px"><button data-action="editLog" data-id="${l.id}">Düzenle</button><button class="danger" data-action="deleteLog" data-id="${l.id}">Sil</button></div></div>`).join('')||empty('Seçili günde kayıt yok.')}`,'span12')}</div>`}

n>`,'span12')}</div>`}
function timerPage(){return header('Çalışma zamanlayıcısı','Sayaç durdurulsa veya ekran kapansa bile süre başlangıç zamanından hesaplanır.')+`<div class="grid">${card('Zamanlayıcı',`<div class="field"><label>Ders / konu</label><input id="timerSubject" value="${esc(timerSubject)}" placeholder="Örn. Şerhu Suğra"></div><div class="timer" id="timerDisplay">${clock(timerElapsed)}</div><p class="muted">Zamanlayıcı bu sayfa açıkken çalışır; kaydettiğinde çalışma geçmişine eklenir.</p><div class="row">${btn('Başlat / devam et','timerStart',true)}${btn('Duraklat','timerPause')}${btn('Sıfırla','timerReset')}</div><div class="row" style="margin-top:14px">${btn('Bitir ve kaydet','timerSave',true)}</div>`,'span8')}${card('Hızlı çalışma kaydı',`Geçmişte yaptığın çalışmayı da sayaç kullanmadan kaydedebilirsin.<div class="row" style="margin-top:12px">${btn('Manuel kayıt ekle','addLog',true)}</div>`,'span4')}</div>`}function clock(s){s=Math.max(0,Math.floor(s));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')}
function render(){applyTheme();navRender();let views={home,program,tasks:tasksPage,books:booksPage,research:researchPage,growth:growthPage,repeats:repeatsPage,reports:reportsPage,settings:settingsPage,timer:timerPage};$('#app').innerHTML=(views[page]||home)()+`<footer>İlim Takip · Kişisel kullanım için · Düzenli yedek almayı unutma</footer>`;if(page==='timer')updateTimerDisplay()}
function modal(title,html,submitLabel='Kaydet'){let old=$('#modal');if(old)old.remove();let el=document.createElement('div');el.id='modal';el.style='position:fixed;inset:0;background:#0007;z-index:30;display:grid;place-items:center;padding:14px';el.innerHTML=`<section class="card" style="width:min(650px,100%);max-height:92vh;overflow:auto"><div class="between"><h2 style="font-size:21px;margin:0">${title}</h2><button data-action="closeModal">✕</button></div><form id="modalForm">${html}<div class="row" style="justify-content:flex-end;margin-top:16px"><button type="button" data-action="closeModal">İptal</button><button class="primary" type="submit">${submitLabel}</button></div></form></section>`;document.body.append(el)}function getForm(){return Object.fromEntries(new FormData($('#modalForm')).entries())}function find(arr,id){return arr.find(x=>x.id===id)}
function showForm(kind,id){let obj=id?find(({schedule:data.schedule,tasks:data.tasks,books:data.books,research:data.research,topics:data.topics,goals:data.goals,habits:data.habits,repeats:data.repeats,logs:data.logs})[kind],id):{};obj=obj||{};editing={kind,id:id||null};let h='',title='';switch(kind){case'schedule':title=id?'Dersi düzenle':'Ders ekle';h=`${selectField('Gün','day',dayNames.map((d,i)=>[String(i),d]),String(obj.day??selectedDay))}<div class="formgrid">${field('Ders adı','subject','text',obj.subject||'','Ders adı')}${field('Başlangıç','start','time',obj.start||'')}${field('Bitiş','end','time',obj.end||'')}</div>${field('Konu','topic','text',obj.topic||'','İşlenecek konu')}${field('Ödev','homework','text',obj.homework||'','Ödev / yapılacaklar')}${textarea('Not','note',obj.note||'')}`;break;
case'task':title=id?'Görevi düzenle':'Görev ekle';h=`${field('Görev','title','text',obj.title||'','Görev adı','required')}${field('Tarih (isteğe bağlı)','date','date',obj.date||today())}${field('Kategori','category','text',obj.category||'','Örn. Ders, kişisel')}${textarea('Not','note',obj.note||'')}`;break;
case'book':title=id?'Kitabı düzenle':'Kitap ekle';h=`${field('Kitap adı','title','text',obj.title||'','Kitap adı','required')}${field('Yazar','author','text',obj.author||'','Yazar') }<div class="formgrid">${field('Toplam sayfa','total','number',obj.total||'','', 'min="0"')}${field('Gelinen sayfa','current','number',obj.current||0,'','min="0"')}</div><div class="formgrid">${field('Başlangıç tarihi','start','date',obj.start||'')}${field('Bitiş tarihi','end','date',obj.end||'')}</div>${textarea('Okuma notu / özet','note',obj.note||'')}`;break;
case'research':title=id?'Araştırmayı düzenle':'Araştırma ekle';h=`${field('Başlık','title','text',obj.title||'','Konu başlığı','required')}${field('Etiketler','tags','text',obj.tags||'','Örn. kelâm, biyoloji')}${textarea('Not / içerik','content',obj.content||'','Araştırma notlarını buraya yaz veya yapıştır…')}${field('Kaynak / bağlantı','source','text',obj.source||'','Kitap, yazar veya URL')}`;break;
case'topic':title=id?'Konuyu düzenle':'Gelişim konusu ekle';h=`${field('Konu adı','title','text',obj.title||'','Örn. İrade','required')}${field('İlerleme (%)','progress','number',obj.progress||0,'0–100','min="0" max="100"')}${field('Sonraki adım','next','text',obj.next||'','Uygulayacağım küçük adım')}${textarea('Notlar','note',obj.note||'')}`;break;
case'goal':title=id?'Hedefi düzenle':'Hedef ekle';h=`${field('Hedef','title','text',obj.title||'','Somut hedef','required')}${field('Son tarih','deadline','date',obj.deadline||'')}${field('İlerleme (%)','progress','number',obj.progress||0,'0–100','min="0" max="100"')}${selectField('Durum','done',[['false','Devam ediyor'],['true','Tamamlandı']],String(!!obj.done))}${textarea('Not','note',obj.note||'')}`;break;
case'habit':title=id?'Alışkanlığı düzenle':'Alışkanlık ekle';h=`${field('Alışkanlık','name','text',obj.name||'','Örn. 10 dakika okuma','required')}${selectField('Sıklık','frequency',[['Her gün','Her gün'],['Haftada 3 gün','Haftada 3 gün'],['Haftada 1 gün','Haftada 1 gün']],obj.frequency||'Her gün')}`;break;

function saveEntity(){let f=getForm(),{kind,id}=editing;let arr=({schedule:data.schedule,task:data.tasks,book:data.books,research:data.research,topic:data.topics,goal:data.goals,habit:data.habits,repeat:data.repeats,log:data.logs})[kind];let obj={...(id?find(arr,id):{}),...f,id:id||uid()};if(kind==='schedule')obj.day=+f.day;if(kind==='book'){obj.total=+f.total||0;obj.current=+f.current||0}if(kind==='topic')obj.progress=Math.max(0,Math.min(100,+f.progress||0));if(kind==='goal'){obj.progress=Math.max(0,Math.min(100,+f.progress||0));obj.done=f.done==='true'}if(kind==='habit')obj.active=true;if(kind==='log')obj.minutes=Math.max(1,+f.minutes||1);if(kind==='task')obj.done=!!(id&&find(arr,id)?.done);if(kind==='repeat')obj.done=!!(id&&find(arr,id)?.done);if(kind==='research'){obj.updated=today();obj.star=!!obj.star}if(id){let n=arr.findIndex(x=>x.id===id);if(n>=0)arr[n]=obj}else arr.push(obj);save();$('#modal')?.remove();toast('Kaydedildi');render()}
function del(arr,id){if(!confirm('Bu kaydı silmek istiyor musun?'))return;let i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1);save();render()}
function backup(){let blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ilim-takip-yedek-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Yedek dosyası hazırlandı')}
function restore(file){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.logs)||!Array.isArray(x.schedule))throw Error();if(!confirm('Bu işlem mevcut verilerin yerine yedek dosyasını yükler. Devam edilsin mi?'))return;data={...blank(),...x};save();toast('Yedek geri yüklendi');render()}catch(e){toast('Dosya geçerli bir İlim Takip yedeği değil.')}};r.readAsText(file)}
function updateTimerDisplay(){if(page!=='timer')return;let s=timerElapsed+(timerStart?Math.floor((Date.now()-timerStart)/1000):0);$('#timerDisplay').textContent=clock(s);if(timerStart)timerInterval=setTimeout(updateTimerDisplay,1000)}function timerPause(){if(timerStart){timerElapsed+=Math.floor((Date.now()-timerStart)/1000);timerStart=null}clearTimeout(timerInterval);updateTimerDisplay()}
function quickMenu(){modal('Hızlı kayıt',`<div class="grid">${[['Çalışma kaydı','log'],['Araştırma','research'],['Görev','task'],['Kitap','book'],['Gelişim konusu','topic'],['Tekrar','repeat']].map(([t,k])=>`<div class="span6"><button style="width:100%;padding:14px" type="button" data-action="quickKind" data-value="${k}">＋ ${t}</button></div>`).join('')}</div>`,'')}
$('#sideNav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});$('#mobileNav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});$('#quickAdd').onclick=quickMenu;$('#headerSearch').onclick=()=>{go('research');setTimeout(()=>$('#globalSearch')?.focus(),50)};
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id,v=b.dataset.value;switch(a){case'pickDay':selectedDay=+v;render();break;case'pickDate':selectedDate=v;reportMonth=v.slice(0,7);render();break;case'addSchedule':showForm('schedule');break;case'editSchedule':showForm('schedule',id);break;case'deleteSchedule':del(data.schedule,id);break;case'addTask':showForm('task');break;case'editTask':showForm('task',id);break;case'deleteTask':del(data.tasks,id);break;case'addBook':showForm('book');break;case'editBook':showForm('book',id);break;case'deleteBook':del(data.books,id);break;case'addResearch':showForm('research');break;case'editResearch':showForm('research',id);break;case'deleteResearch':del(data.research,id);break;case'starResearch':{let r=find(data.research,id);r.star=!r.star;save();render();break}case'addTopic':showForm('topic');break;case'editTopic':showForm('topic',id);break;case'deleteTopic':del(data.topics,id);break;case'addGoal':showForm('goal');break;case'editGoal':showForm('goal',id);break;case'deleteGoal':del(data.goals,id);break;case'addHabit':showForm('habit');break;case'editHabit':showForm('habit',id);break;case'deleteHabit':del(data.habits,id);break;case'addRepeat':showForm('repeat');break;case'editRepeat':showForm('repeat',id);break;case'deleteRepeat':del(data.repeats,id);break;case'addLog':showForm('log');break;case'editLog':showForm('log',id);break;case'deleteLog':del(data.logs,id);break;case'taskCheck':{let t=find(data.tasks,id);t.done=b.checked;save();render();break}case'habitCheck':{data.habitHistory[today()]??={};data.habitHistory[today()][id]=b.checked;save();render();break}case'repeatCheck':{find(data.repeats,id).done=b.checked;save();render();break}case'dailyCheck':{let c=data.dailyChecks[selectedDate];c.customDone??=[];let n=+id;c.customDone=b.checked?[...new Set([...c.customDone,n])]:c.customDone.filter(x=>x!==n);save();render();break}case'addDailyCheck':{let name=prompt('Bu güne eklenecek kontrol maddesi:');if(name?.trim()){data.dailyChecks[selectedDate]??={};data.dailyChecks[selectedDate].custom??=[];data.dailyChecks[selectedDate].custom.push(name.trim());save();render()}break}case'goProgram':go('program');break;case'goTasks':go('tasks');break;case'goRepeats':go('repeats');break;case'goResearch':go('research');break;case'timer':go('timer');break;case'backup':backup();break;case'restorePick':$('#restoreFile').click();break;case'saveSettings':{data.settings.theme=document.querySelector('[name=theme]')?.value||data.settings.theme;data.settings.accent=document.querySelector('[name=accent]')?.value||data.settings.accent;save();render();toast('Görünüm kaydedildi');break}case'resetData':if(confirm('TÜM kayıtlar kalıcı olarak silinecek. Önce yedek aldığından emin misin?')&&confirm('Son kez soruyorum: tüm veriler silinsin mi?')){data=blank();save();render()}break;case'closeModal':$('#modal')?.remove();break;case'quickKind':$('#modal')?.remove();showForm(v);break;case'search':searchQuery=$('#globalSearch')?.value||'';render();break;case'clearSearch':searchQuery='';render();break;case'refreshReport':reportMonth=$('#reportMonth').value||today().slice(0,7);render();break;case'saveReflection':{let d=$('#reflectionDate').value||today(),f={date:d,learned:$('[name=learned]').value,applied:$('[name=applied]').value,review:$('[name=review]').value};let old=data.notes.find(n=>n.date===d);if(old)Object.assign(old,f);else data.notes.push(f);selectedDate=d;save();render();toast('Değerlendirme kaydedildi');break}case'timerStart':if(!timerStart){timerSubject=$('#timerSubject')?.value||timerSubject;timerStart=Date.now();updateTimerDisplay()}break;case'timerPause':timerPause();break;case'timerReset':timerPause();timerElapsed=0;updateTimerDisplay();break;case'timerSave':{timerSubject=$('#timerSubject')?.value||timerSubject;let m=Math.floor((timerElapsed+(timerStart?Math.floor((Date.now()-timerStart)/1000):0))/60);timerPause();if(m<1){toast('Kaydetmek için en az bir dakika çalışmış olmalısın.');break}data.logs.push({id:uid(),date:today(),subject:timerSubject||'Genel çalışma',minutes:m,topic:'',pages:'',note:'Zamanlayıcı ile kaydedildi'});timerElapsed=0;timerSubject='';save();toast('Çalışma kaydedildi');go('reports');break}case'openResearch':showForm('research',id);break}}
);document.addEventListener('submit',e=>{if(e.target.id==='modalForm'){e.preventDefault();saveEntity()}});document.addEventListener('change',e=>{if(e.target.id==='restoreFile'&&e.target.files[0])restore(e.target.files[0]);if(e.target.id==='dailyDate'){selectedDate=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='globalSearch'&&page==='research'){searchQuery=e.target.value;let p=e.target.selectionStart;render();let x=$('#globalSearch');x?.focus();x?.setSelectionRange(p,p)}});
applyTheme();render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
